<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="home" x1="150" y1="200" x2="620" y2="830" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="link" x1="450" y1="530" x2="840" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <!-- the house passes under the link at the upper crossing -->
    <mask id="homeCut" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="960">
      <rect width="960" height="960" fill="#fff"/>
      <path d="M530 540 H650" stroke="#000" stroke-width="112"/>
    </mask>
    <!-- the link passes under the house at the lower crossing -->
    <mask id="linkCut" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="960">
      <rect width="960" height="960" fill="#fff"/>
      <path d="M590 670 V770" stroke="#000" stroke-width="112"/>
    </mask>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#1E1B4B"/><stop offset="1" stop-color="#070A1A"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6366F1" stop-opacity=".45"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A5B4FC" stop-opacity=".15"/><stop offset="1" stop-color="#A5B4FC" stop-opacity=".6"/></linearGradient>
  </defs>
  <rect width="1000" height="700" fill="url(#bg)"/>
  <circle cx="500" cy="350" r="330" fill="url(#glow)"/>
  <g stroke="#A5B4FC" stroke-opacity=".35" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" fill="none">
    <path d="M205 185 L360 270"/><path d="M205 515 L360 430"/><path d="M795 185 L640 270"/><path d="M795 515 L640 430"/>
  </g>
  <g transform="translate(150 155)">
    <circle r="62" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>
    <g fill="none" stroke="#E0E7FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 22 H14 M-10 34 H10 M-14 14 C-14 2 -26 -2 -26 -16 A26 26 0 0 1 26 -16 C26 -2 14 2 14 14 Z"/></g>
  </g>
  <g transform="translate(150 545)">
    <circle r="62" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>
    <g fill="none" stroke="#E0E7FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="-24" y="-12" width="48" height="34" rx="8"/><path d="M-10 -12 V-30 M10 -12 V-30 M0 22 V38"/></g>
  </g>
  <g transform="translate(850 155)">
    <circle r="62" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>
    <g fill="none" stroke="#E0E7FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M-40 -22 Q0 6 40 -22"/><path d="M-22 -10 V-2 M0 -8 V2 M22 -10 V-2"/><ellipse cx="-22" cy="10" rx="7" ry="10" fill="#E0E7FF"/><ellipse cx="0" cy="14" rx="7" ry="10" fill="#E0E7FF"/><ellipse cx="22" cy="10" rx="7" ry="10" fill="#E0E7FF"/></g>
  </g>
  <g transform="translate(850 545)">
    <circle r="62" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>
    <g fill="none" stroke="#E0E7FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle r="7" fill="#E0E7FF"/><path d="M-20 -20 A28 28 0 0 0 -20 20 M20 -20 A28 28 0 0 1 20 20 M-32 -32 A45 45 0 0 0 -32 32 M32 -32 A45 45 0 0 1 32 32"/></g>
  </g>
  <g transform="translate(500 350) scale(.5) translate(-480 -480)">
    <g transform="translate(-20 -30)">
    <rect x="460" y="540" width="370" height="180" rx="90" fill="none" stroke="url(#link)" stroke-width="64" mask="url(#linkCut)"/>
    <path d="M170 820 H590 V410 L380 210 L170 410 Z" fill="none" stroke="url(#home)" stroke-width="64" stroke-linejoin="round" mask="url(#homeCut)"/>
    <circle cx="320" cy="650" r="46" fill="url(#link)"/>
    </g>
  </g>
</svg>
